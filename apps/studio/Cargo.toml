[package]
name = "luma-studio"
description = "LÜMA Studio : l'application de développement photo (macOS d'abord)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "luma-studio"
path = "src/main.rs"

[dependencies]
luma-core.workspace = true
luma-color.workspace = true
luma-raw.workspace = true
luma-project.workspace = true
luma-image.workspace = true
luma-render.workspace = true
luma-library.workspace = true
luma-gpu.workspace = true
luma-merge.workspace = true
luma-brand.workspace = true
luma-licence.workspace = true
luma-i18n.workspace = true
luma-apple.workspace = true
egui.workspace = true
# Lire la table des caractères des polices du système (déjà compilé pour egui).
skrifa = { version = "0.44", default-features = false, features = ["std", "autohint_shaping"] }
# Les tuiles de la carte (PNG).
image.workspace = true
wgpu.workspace = true
# Le travail de fond (doublons) sur ses propres fils.
rayon.workspace = true

# Sur Mac : l'accessibilité (VoiceOver). Ailleurs : X11 seulement (Wayland compilerait
# du C ; sous Wayland, l'app passe par XWayland).
[target.'cfg(target_os = "macos")'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }
rfd.workspace = true

# iPhone et iPad : pas de sélecteur de fichiers de bureau (l'app ouvre son dossier
# Documents, que remplit l'app Fichiers).
[target.'cfg(target_os = "ios")'.dependencies]
eframe.workspace = true
raw-window-handle = "0.6"

[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
eframe = { workspace = true, features = ["x11"] }
rfd.workspace = true

[dev-dependencies]
luma-licence.workspace = true
egui_kittest.workspace = true
image.workspace = true

[lints]
workspace = true
