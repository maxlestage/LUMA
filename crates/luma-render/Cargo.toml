[package]
name = "luma-render"
description = "Moteur de rendu de LÜMA : photo ouverte, sources en cache, rendu annulable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
luma-core.workspace = true
luma-color.workspace = true
luma-raw.workspace = true
luma-project.workspace = true
luma-image.workspace = true
image.workspace = true
image-webp.workspace = true
rayon.workspace = true
serde.workspace = true
skrifa.workspace = true
epaint_default_fonts.workspace = true
serde_json.workspace = true
# Le doublon de travail : compression LZ4 (Rust pur, sans unsafe).
# Les pages CMJN du PDF, compressées sans perte (zlib, en Rust pur).
miniz_oxide = "0.8"
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }

[lints]
workspace = true
