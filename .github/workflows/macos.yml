# LÜMA Studio sur Mac, à chaque push et pull request :
#
# - compilation et tests sur un runner Apple Silicon (le rendu de l'interface et la
#   finition des photos passent par Metal ; le GPU est comparé au processeur) ;
# - mesure de la finition sur le GPU, affichée dans le résumé du job ;
# - fabrication de LÜMA.app, universelle (Apple Silicon et Intel), publiée en artefact
#   avec les captures de l'interface ;
# - iPhone et iPad : l'app pour l'appareil et pour le simulateur, lancée dans le
#   simulateur avec de vrais RAW, et sa capture d'écran.

name: macOS

on:
  push:
    paths-ignore: ["site/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "*.md"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Compiler, tester, empaqueter LÜMA.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Corpus de RAW (cache)
        uses: actions/cache@v4
        with:
          path: tests/raw-corpus
          key: raw-corpus-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - name: Corpus de RAW (téléchargement)
        run: scripts/fetch-corpus.sh

      - name: Tests (moteur et app)
        run: cargo test --workspace

      - name: Réactivité sur Metal
        run: |
          {
            echo '### Finition d'"'"'un aperçu 2048 px, processeur et GPU (Metal, runner GitHub)'
            echo '```'
            for f in tests/raw-corpus/*.{ARW,CR3,NEF,RAF,DNG}; do
              [ -f "$f" ] && cargo run -q --release -p luma-gpu --example bench -- "$f"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: LÜMA.app
        run: scripts/bundle-macos.sh

      - name: Publier l'app
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-macos
          path: target/macos/LUMA-macos.zip
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-macos
          path: target/studio-*.png

  ios:
    name: iPhone et iPad (simulateur)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      - name: Corpus de RAW (cache)
        uses: actions/cache@v4
        with:
          path: tests/raw-corpus
          key: raw-corpus-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - name: Corpus de RAW (téléchargement)
        run: scripts/fetch-corpus.sh

      - name: LÜMA.app pour iPhone (appareil, non signée) et simulateur
        run: |
          scripts/bundle-ios.sh device
          scripts/bundle-ios.sh sim

      # L'app tourne vraiment : installée dans le simulateur, deux RAW déposés dans
      # ses Documents (comme par l'app Fichiers), lancée, puis photographiée.
      - name: Lancement dans le simulateur
        run: |
          set -x
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for runtime, devs in sorted(d.items(), reverse=True):
              if "iOS" in runtime:
                  for x in devs:
                      if x["name"].startswith("iPhone"):
                          print(x["udid"]); sys.exit()')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "target/ios/sim/LÜMA.app"
          data=$(xcrun simctl get_app_container "$udid" app.luma.studio data)
          mkdir -p "$data/Documents"
          cp tests/raw-corpus/_DSC0009.ARW tests/raw-corpus/AFXT2720.RAF "$data/Documents/"
          xcrun simctl launch "$udid" app.luma.studio
          sleep 45
          xcrun simctl io "$udid" screenshot target/ios-iphone.png
          # Toujours vivante ?
          xcrun simctl spawn "$udid" launchctl list | grep -i luma
          ls -la "$data/Documents"

      - name: Journal de l'app (en cas d'échec)
        if: failure()
        run: xcrun simctl spawn booted log show --last 5m --predicate 'process == "luma-studio"' | tail -100

      - name: Publier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-ios
          path: |
            target/ios/*/LUMA-ios-*.zip
            target/ios-iphone.png
