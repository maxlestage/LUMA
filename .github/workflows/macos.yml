# LÜMA Studio sur Mac, à chaque push et pull request :
#
# - compilation et tests sur un runner Apple Silicon (le rendu de l'interface et la
#   finition des photos passent par Metal ; le GPU est comparé au processeur) ;
# - mesure de la finition sur le GPU, affichée dans le résumé du job ;
# - fabrication de LÜMA.app, universelle (Apple Silicon et Intel), publiée en artefact
#   avec les captures de l'interface ;
# - iPhone et iPad : l'app pour l'appareil et pour le simulateur, lancée dans le
#   simulateur avec de vrais RAW, et sa capture d'écran.

name: macOS

on:
  push:
    paths-ignore: ["site/**", "docs/**", "*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "*.md"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: Compiler, tester, empaqueter LÜMA.app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Corpus de RAW (cache)
        uses: actions/cache@v4
        with:
          path: tests/raw-corpus
          key: raw-corpus-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - name: Corpus de RAW (téléchargement)
        run: scripts/fetch-corpus.sh

      - name: Tests (moteur et app)
        run: cargo test --workspace

      - name: Réactivité sur Metal
        run: |
          {
            echo '### Finition d'"'"'un aperçu 2048 px, processeur et GPU (Metal, runner GitHub)'
            echo '```'
            for f in tests/raw-corpus/*.{ARW,CR3,NEF,RAF,DNG}; do
              [ -f "$f" ] && cargo run -q --release -p luma-gpu --example bench -- "$f"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: LÜMA.app
        env:
          # La boutique (Settings → Secrets and variables → Actions → Variables).
          LUMA_CHECKOUT_MONTHLY: ${{ vars.LUMA_CHECKOUT_MONTHLY }}
          LUMA_CHECKOUT_ANNUAL: ${{ vars.LUMA_CHECKOUT_ANNUAL }}
          LUMA_STORE_ID: ${{ vars.LUMA_STORE_ID }}
        run: scripts/bundle-macos.sh

      - name: Publier l'app
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-macos
          path: target/macos/LUMA-macos.zip
      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-macos
          path: target/studio-*.png

  ios:
    name: iPhone et iPad (simulateur)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      - name: Corpus de RAW (cache)
        uses: actions/cache@v4
        with:
          path: tests/raw-corpus
          key: raw-corpus-${{ hashFiles('scripts/fetch-corpus.sh') }}
      - name: Corpus de RAW (téléchargement)
        run: scripts/fetch-corpus.sh

      - name: LÜMA.app pour iPhone (appareil, non signée) et simulateur
        run: |
          scripts/bundle-ios.sh device
          scripts/bundle-ios.sh sim

      # L'app tourne vraiment : installée dans le simulateur, deux RAW déposés dans
      # ses Documents (comme par l'app Fichiers), lancée, puis photographiée.
      - name: Lancement dans le simulateur
        run: |
          set -x
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          for runtime, devs in sorted(d.items(), reverse=True):
              if "iOS" in runtime:
                  for x in devs:
                      if x["name"].startswith("iPhone"):
                          print(x["udid"]); sys.exit()')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "target/ios/sim/LÜMA.app"
          data=$(xcrun simctl get_app_container "$udid" app.luma.studio data)
          mkdir -p "$data/Documents"
          cp tests/raw-corpus/_DSC0009.ARW tests/raw-corpus/AFXT2720.RAF "$data/Documents/"
          SIMCTL_CHILD_RUST_BACKTRACE=1 xcrun simctl launch --stdout="$PWD/target/ios-stdout.txt" --stderr="$PWD/target/ios-stderr.txt" "$udid" app.luma.studio
          sleep 45
          xcrun simctl io "$udid" screenshot target/ios-iphone.png
          ls -la "$data/Documents"
          echo "--- sortie de l'app ---"; cat target/ios-stdout.txt target/ios-stderr.txt "$data/Documents/LÜMA-journal.txt" "$data/Documents/LÜMA-erreur.txt" || true
          # Toujours vivante ? (les apps du simulateur sont des processus du Mac)
          if ! pgrep -fl luma-studio; then
            echo "L'app s'est arrêtée. Rapports de plantage :"
            ls -t ~/Library/Logs/DiagnosticReports/ | head -5
            f=$(ls -t ~/Library/Logs/DiagnosticReports/luma-studio* 2>/dev/null | head -1)
            [ -n "$f" ] && head -120 "$f"
            exit 1
          fi
          # L'écran montre bien l'interface (pas un écran noir) : part des pixels
          # clairs ou colorés dans la capture.
          xcrun simctl io "$udid" screenshot --type=bmp target/ios-iphone.bmp
          python3 - <<'PY'
          import struct
          data = open("target/ios-iphone.bmp", "rb").read()
          offset, = struct.unpack_from("<I", data, 10)
          w, h = struct.unpack_from("<ii", data, 18)
          bpp, = struct.unpack_from("<H", data, 28)
          step = bpp // 8
          px = data[offset:]
          lit = sum(1 for i in range(0, len(px) - step, step * 97) if max(px[i:i + 3]) > 60)
          total = len(range(0, len(px) - step, step * 97))
          print(f"capture {w} × {abs(h)}, {bpp} bits : {100 * lit / total:.1f} % de pixels non sombres")
          assert lit / total > 0.05, "écran presque noir"
          PY

      - name: Journal de l'app (en cas d'échec)
        if: failure()
        run: xcrun simctl spawn booted log show --last 5m --predicate 'process == "luma-studio"' | tail -100

      - name: Publier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-ios
          path: |
            target/ios/*/LUMA-ios-*.zip
            target/ios-iphone.png
            target/ios-std*.txt
