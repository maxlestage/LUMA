# Publie le site sur GitHub Pages à chaque push sur master (et à la demande).
#
# - mac-app : LÜMA.app universelle (Apple Silicon et Intel), publiée avec le site sous
#   /download/LUMA-macos.zip (un mois d'essai, puis LÜMA Premium) ;
# - linux-app : LÜMA pour Linux, sous /download/LUMA-linux-x86_64.tar.gz et
#   /download/LUMA-linux-amd64.deb ;
# - windows-app : LÜMA pour Windows, sous /download/LUMA-windows-x86_64-setup.exe et
#   /download/LUMA-windows-x86_64.zip ;
# - build : vérifications (fmt, clippy serveur et WebAssembly, tests), bundle du
#   navigateur, puis export statique du site par le serveur Paquets lui-même, liens
#   sous /<dépôt> ;
# - deploy : publication de l'export sur GitHub Pages (master seulement ; une pull
#   request ne fait que les vérifications et la construction).

name: GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Paquets et ses paquets (Vitesse, Securite, Memoire, Active) sont des dépôts privés :
  # Cargo les récupère par git, qui demande ses identifiants GitHub à un assistant lisant
  # le secret REPOS_TOKEN, un jeton qui peut les lire. Le jeton n'apparaît dans aucune URL.
  REPOS_TOKEN: ${{ secrets.REPOS_TOKEN }}
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_CONFIG_COUNT: ${{ secrets.REPOS_TOKEN != '' && 1 || 0 }}
  GIT_CONFIG_KEY_0: credential.https://github.com.helper
  GIT_CONFIG_VALUE_0: '!f() { test "$1" = get && echo username=x-access-token && echo "password=$REPOS_TOKEN"; }; f'
  CARGO_TERM_COLOR: always

jobs:
  mac-app:
    name: LÜMA.app à télécharger
    # GitHub Pages sur un dépôt privé demande un compte payant : le site est alors sur
    # Heroku (deploy-heroku.yml), et ce workflow ne publie rien.
    # Tant que le téléchargement est fermé (variable LUMA_DOWNLOADS ≠ 1), le site n'a
    # pas d'app à servir : ce long job est sauté et le site part en quelques minutes.
    if: ${{ !github.event.repository.private && vars.LUMA_DOWNLOADS == '1' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: LÜMA.app (universelle)
        env:
          LUMA_CHECKOUT_MONTHLY: ${{ vars.LUMA_CHECKOUT_MONTHLY }}
          LUMA_CHECKOUT_ANNUAL: ${{ vars.LUMA_CHECKOUT_ANNUAL }}
          LUMA_LICENCE_PUBLIC: ${{ vars.LUMA_LICENCE_PUBLIC }}
          LUMA_LICENCE_SERVER: ${{ vars.LUMA_LICENCE_SERVER }}
          LUMA_BILLING_PORTAL: ${{ vars.LUMA_BILLING_PORTAL }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: telechargement-mac
          path: target/macos/LUMA-macos.zip

  linux-app:
    name: LÜMA pour Linux à télécharger
    if: ${{ !github.event.repository.private && vars.LUMA_DOWNLOADS == '1' }}
    # Le plus ancien Ubuntu de GitHub : l'app tourne sur glibc 2.35 et plus.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Archive et paquet .deb
        env:
          LUMA_CHECKOUT_MONTHLY: ${{ vars.LUMA_CHECKOUT_MONTHLY }}
          LUMA_CHECKOUT_ANNUAL: ${{ vars.LUMA_CHECKOUT_ANNUAL }}
          LUMA_LICENCE_PUBLIC: ${{ vars.LUMA_LICENCE_PUBLIC }}
          LUMA_LICENCE_SERVER: ${{ vars.LUMA_LICENCE_SERVER }}
          LUMA_BILLING_PORTAL: ${{ vars.LUMA_BILLING_PORTAL }}
        run: scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: telechargement-linux
          path: |
            target/linux/LUMA-linux-x86_64.tar.gz
            target/linux/LUMA-linux-amd64.deb

  windows-app:
    name: LÜMA pour Windows à télécharger
    if: ${{ !github.event.repository.private && vars.LUMA_DOWNLOADS == '1' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Installateur et archive .zip
        env:
          LUMA_CHECKOUT_MONTHLY: ${{ vars.LUMA_CHECKOUT_MONTHLY }}
          LUMA_CHECKOUT_ANNUAL: ${{ vars.LUMA_CHECKOUT_ANNUAL }}
          LUMA_LICENCE_PUBLIC: ${{ vars.LUMA_LICENCE_PUBLIC }}
          LUMA_LICENCE_SERVER: ${{ vars.LUMA_LICENCE_SERVER }}
          LUMA_BILLING_PORTAL: ${{ vars.LUMA_BILLING_PORTAL }}
        shell: pwsh
        run: scripts/bundle-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: telechargement-windows
          path: |
            target/windows/LUMA-windows-x86_64-setup.exe
            target/windows/LUMA-windows-x86_64.zip

  build:
    name: Vérifier et construire le site
    needs: [mac-app, linux-app, windows-app]
    if: ${{ always() && !github.event.repository.private && (needs.mac-app.result == 'success' || needs.mac-app.result == 'skipped') && (needs.linux-app.result == 'success' || needs.linux-app.result == 'skipped') && (needs.windows-app.result == 'success' || needs.windows-app.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      - name: Format
        run: cargo fmt --check
      - name: Clippy (serveur)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (WebAssembly)
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Tests
        run: cargo test

      - name: Bundle du navigateur (îlots et animations)
        run: |
          cargo build --lib --target wasm32-unknown-unknown --profile wasm-release
          # wasm-bindgen doit être la version de Cargo.lock.
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.local/bin" \
            || cargo install wasm-bindgen-cli --version "$version" --locked --root "$HOME/.local"
          "$HOME/.local/bin/wasm-bindgen" --target web --no-typescript --out-dir pkg \
            target/wasm32-unknown-unknown/wasm-release/luma_site.wasm

      - name: Export statique
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          LUMA_CHECKOUT_MONTHLY: ${{ vars.LUMA_CHECKOUT_MONTHLY }}
          LUMA_CHECKOUT_ANNUAL: ${{ vars.LUMA_CHECKOUT_ANNUAL }}
          # L'app est notariée quand le certificat et la clé d'API Apple sont là.
          LUMA_MAC_NOTARIZED: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.APPLE_API_KEY_ID != '' && '1' || '' }}
          LUMA_DOWNLOADS: ${{ vars.LUMA_DOWNLOADS }}
          # Sans fichiers servis par le site, les boutons « Télécharger » mènent à ceux de
          # la dernière Release GitHub (l'app Mac, Linux et Windows y sont).
          LUMA_RELEASE_DOWNLOADS: https://github.com/${{ github.repository }}/releases/latest/download
          # Les fichiers Windows arrivent après l'export : la page ne peut pas les voir.
          LUMA_WINDOWS_DOWNLOADS: ${{ vars.LUMA_DOWNLOADS }}
        run: |
          cargo run --release -- export dist
          test -f dist/index.html && test -f dist/pkg/luma_site_bg.wasm

      # L'app à télécharger, construite par le job mac-app : /download/LUMA-macos.zip.
      - uses: actions/download-artifact@v4
        if: vars.LUMA_DOWNLOADS == '1'
        with:
          name: telechargement-mac
          path: site/dist/download
      - uses: actions/download-artifact@v4
        if: vars.LUMA_DOWNLOADS == '1'
        with:
          name: telechargement-linux
          path: site/dist/download
      - uses: actions/download-artifact@v4
        if: vars.LUMA_DOWNLOADS == '1'
        with:
          name: telechargement-windows
          path: site/dist/download
      - name: Téléchargements présents
        if: vars.LUMA_DOWNLOADS == '1'
        run: |
          test -s dist/download/LUMA-macos.zip
          test -s dist/download/LUMA-linux-x86_64.tar.gz
          test -s dist/download/LUMA-linux-amd64.deb
          test -s dist/download/LUMA-windows-x86_64-setup.exe
          test -s dist/download/LUMA-windows-x86_64.zip

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Publier sur GitHub Pages
    # !cancelled() : publier même quand le job de l'app Mac a été sauté (téléchargement
    # fermé) ; GitHub sauterait sinon tout ce qui en dépend.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
