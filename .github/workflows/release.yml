# Une version de LÜMA à télécharger : à chaque étiquette v… (ex. v0.1.0), l'app Mac
# universelle, l'app iPhone et iPad (non signée, à signer avec un compte Apple
# Developer), l'app Linux (archive et paquet .deb) et la ligne de commande `luma`
# sont construites et publiées dans une Release GitHub.

name: Release

on:
  push:
    tags: ["v*"]
  # À la main (Actions → Release → Run workflow) : la version à publier ; l'étiquette
  # est créée sur le commit lancé.
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LUMA_CHECKOUT_MONTHLY: ${{ vars.LUMA_CHECKOUT_MONTHLY }}
  LUMA_CHECKOUT_ANNUAL: ${{ vars.LUMA_CHECKOUT_ANNUAL }}
  LUMA_LICENCE_PUBLIC: ${{ vars.LUMA_LICENCE_PUBLIC }}
  LUMA_LICENCE_SERVER: ${{ vars.LUMA_LICENCE_SERVER }}
  LUMA_BILLING_PORTAL: ${{ vars.LUMA_BILLING_PORTAL }}

jobs:
  apple:
    name: Mac, iPhone et iPad
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - name: LÜMA.app pour Mac (universelle, signée et notariée si les secrets Apple sont là)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/bundle-macos.sh
      - name: LÜMA.app pour iPhone et iPad (non signée)
        run: scripts/bundle-ios.sh device
      - name: luma (ligne de commande, Mac)
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p luma-cli --target $t
          done
          lipo -create -output target/luma target/aarch64-apple-darwin/release/luma target/x86_64-apple-darwin/release/luma
          (cd target && zip -q luma-cli-macos.zip luma)
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            target/macos/LUMA-macos.zip
            target/ios/device/LUMA-ios-device.zip
            target/luma-cli-macos.zip

  linux:
    name: Linux
    # Le plus ancien Ubuntu de GitHub : l'app tourne sur glibc 2.35 et plus.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: "LÜMA pour Linux (x86_64), archive et paquet .deb"
        run: scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/linux/LUMA-linux-x86_64.tar.gz
            target/linux/LUMA-linux-amd64.deb

  publish:
    name: Publier la Release
    needs: [apple, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "version invalide : $TAG"; exit 1 ;; esac
          find dist -type f
          notes="LÜMA ${TAG#v} — sur Mac et Linux, 14 jours d'essai puis LÜMA Premium (19,99 € par mois ou 239,88 € par an) ; sur iPhone et iPad, un mois d'essai puis 89,99 € une fois pour toutes.

          - **LUMA-macos.zip** : l'app pour Mac (Apple Silicon et Intel, macOS 11+).
          - **LUMA-linux-x86_64.tar.gz** : l'app pour Linux, avec la ligne de commande \`luma\` ; \`./install.sh\` l'installe sans mot de passe.
          - **LUMA-linux-amd64.deb** : la même, pour Debian et Ubuntu (\`sudo apt install ./LUMA-linux-amd64.deb\`).
          - **LUMA-ios-device.zip** : l'app pour iPhone et iPad, non signée (à signer pour l'installer).
          - **luma-cli-macos.zip** : la ligne de commande \`luma\` pour Mac."
          files=$(find dist -type f)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files --target "$GITHUB_SHA" --title "LÜMA ${TAG#v}" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
