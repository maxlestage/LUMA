# Le moteur de LÜMA (crates/) et ses applications (apps/). Le site (site/) est un crate
# à part, avec son propre workspace.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["site"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
luma-core = { path = "crates/luma-core" }
luma-brand = { path = "crates/luma-brand" }
luma-licence = { path = "crates/luma-licence" }
luma-i18n = { path = "crates/luma-i18n" }
luma-color = { path = "crates/luma-color" }
luma-raw = { path = "crates/luma-raw" }
luma-project = { path = "crates/luma-project" }
luma-image = { path = "crates/luma-image" }
luma-gpu = { path = "crates/luma-gpu" }
luma-merge = { path = "crates/luma-merge" }
luma-render = { path = "crates/luma-render" }
# Toutes en Rust, sans code C ni C++ : vérifié en CI (voir .github/workflows/engine.yml).
rawler = "0.8"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# Interface : egui dessine tout (comme Lightroom, sans contrôles natifs), wgpu affiche
# avec Metal sur Mac et iPhone, Vulkan ailleurs.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "default_fonts"] }
egui = "0.37"
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "wgsl", "std", "parking_lot"] }
pollster = "0.4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
egui_kittest = { version = "0.37", features = ["wgpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Les tests de rendu tournent sur de vraies images : optimisés même en test.
[profile.test]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3
