# Le moteur de LÜMA (crates/) et ses applications (apps/). Le site (site/) est un crate
# à part, avec son propre workspace.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["site", "vendor"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
luma-core = { path = "crates/luma-core" }
luma-brand = { path = "crates/luma-brand" }
luma-licence = { path = "crates/luma-licence" }
luma-i18n = { path = "crates/luma-i18n" }
luma-apple = { path = "crates/luma-apple" }
luma-color = { path = "crates/luma-color" }
luma-raw = { path = "crates/luma-raw" }
luma-project = { path = "crates/luma-project" }
luma-image = { path = "crates/luma-image" }
luma-gpu = { path = "crates/luma-gpu" }
luma-merge = { path = "crates/luma-merge" }
luma-render = { path = "crates/luma-render" }
luma-library = { path = "crates/luma-library" }
# Toutes en Rust, sans code C ni C++ : vérifié en CI (voir .github/workflows/engine.yml).
rawler = "0.8"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.42"
# Le filigrane des exports : les contours des lettres (skrifa) et la police de l'app
# (Ubuntu Light), les mêmes que ceux de l'interface : rien de plus à compiler.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
epaint_default_fonts = "0.37"
# Lecture : JPEG, PNG, TIFF, WebP, GIF, BMP, TGA, QOI, OpenEXR, Radiance HDR, PNM, ICO.
image-webp = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "gif", "bmp", "tga", "qoi", "exr", "hdr", "pnm", "ico", "dds", "ff"] }
# Interface : egui dessine tout (sans contrôles natifs, même rendu partout), wgpu affiche
# avec Metal sur Mac et iPhone, DirectX 12 (ou Vulkan) sous Windows, Vulkan ailleurs.
eframe = { version = "0.37", default-features = false, features = ["wgpu_no_default_features", "default_fonts"] }
egui = "0.37"
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "dx12", "wgsl", "std", "parking_lot"] }
pollster = "0.4"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
egui_kittest = { version = "0.37", features = ["wgpu"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

# Les tests de rendu tournent sur de vraies images : optimisés même en test.
[profile.test]
opt-level = 3
[profile.dev.package."*"]
opt-level = 3

# eframe et egui-wgpu corrigés pour l'iPhone et l'iPad : la surface à la taille de
# l'écran entier, comme la mise en page d'egui (voir vendor/README.md).
[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }
